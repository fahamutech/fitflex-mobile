name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-web-hosting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build web release and deploy
    runs-on: ubuntu-latest

    # API_BASE is compiled in via --dart-define. It defaults to the live
    # server; set the API_BASE repository variable only to point at a new
    # production URL.
    env:
      API_BASE: ${{ vars.API_BASE || 'https://fitflex-faas.bfast.smartstock.co.tz' }}
      # Shop home V2 (on/off). Set repo variable SHOP_HOME_V2=true to switch it on;
      # the server also needs SHOP_HOME_V2=1, otherwise the app falls back to today's shop.
      SHOP_HOME_V2: ${{ vars.SHOP_HOME_V2 || 'false' }}
      # Photo heroes (PHOTO_HERO_UI) and the photo footer (PHOTO_FOOTER_UI),
      # on/off. Off unless the repository variable is set to true; the app
      # ignores PHOTO_FOOTER_UI unless PHOTO_HERO_UI is on as well.
      PHOTO_HERO_UI: ${{ vars.PHOTO_HERO_UI || 'false' }}
      PHOTO_FOOTER_UI: ${{ vars.PHOTO_FOOTER_UI || 'false' }}
      # With PHOTO_HERO_UI on, the release guard runs before the build.
      # HERO_IMAGES_REMOTE is not passed here (tester builds only).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pubspec.yaml requires Dart ^3.10.8, i.e. Flutter 3.38 or newer.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      # .env is declared as a bundled asset in pubspec.yaml, so it must exist
      # for the build to succeed. It is gitignored, so generate it here.
      - name: Write runtime .env
        run: echo "API_BASE=$API_BASE" > .env

      - name: Get Flutter dependencies
        run: flutter pub get

      # Photo heroes (PHOTO_HERO_UI) shown to users: no test-only hero photo
      # may ship (kTestOnlyHeroAssets, assets/photos/hero/LICENSES.md). This
      # fails the job, before anything is built, if one is still bundled.
      - name: Photo hero release guard
        if: env.PHOTO_HERO_UI == 'true'
        run: flutter test test/photo_hero_release_guard_test.dart --dart-define=PHOTO_HERO_UI=true --dart-define=PHOTO_HERO_RELEASE=true

      - name: Build web release
        run: flutter build web --release --dart-define=API_BASE="$API_BASE" --dart-define=SHOP_HOME_V2="$SHOP_HOME_V2" --dart-define=PHOTO_HERO_UI="$PHOTO_HERO_UI" --dart-define=PHOTO_FOOTER_UI="$PHOTO_FOOTER_UI"

      - name: Deploy to Firebase Hosting (live)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITFLEX_AF_PILOT }}
          projectId: fitflex-af-pilot
          target: app
          channelId: live
