name: Build Flutter APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pubspec.yaml requires Dart ^3.10.8, i.e. Flutter 3.38 or newer.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      # .env is a bundled asset (pubspec.yaml) and google-services.json is
      # required by the Android Gradle plugin; both are gitignored.
      - name: Write build-time config files
        env:
          API_BASE: ${{ vars.API_BASE || 'http://localhost:3000' }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "API_BASE=$API_BASE" > .env
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set (contents of android/app/google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Analyze Dart code
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug
        env:
          API_BASE: ${{ secrets.API_BASE || 'http://localhost:3000' }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release
        env:
          API_BASE: ${{ secrets.API_BASE || 'http://localhost:3000' }}

      - name: Upload release APK (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: fitflex-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
