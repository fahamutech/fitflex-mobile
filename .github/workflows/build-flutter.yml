name: Build Flutter APK

# PR check: analyze, test and build a debug APK. Merges to main are built and
# sent to testers by distribute-android.yml, so main isn't built twice. The
# debug APK is not stored (it filled the artifact quota); tagged releases are.
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      API_BASE: ${{ vars.API_BASE || 'https://fitflex-faas.bfast.smartstock.co.tz' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pubspec.yaml requires Dart ^3.10.8, i.e. Flutter 3.38 or newer.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      # - .env is a bundled asset (pubspec.yaml) and google-services.json is
      #   required by the Android Gradle plugin; both are gitignored.
      # - android/gradle.properties asks for an 8 GB heap; runners have ~7 GB,
      #   so R8 in release builds swaps for 30+ minutes. User-level
      #   gradle.properties overrides the project value on CI only.
      - name: Prepare build (config, Gradle memory)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set (contents of android/app/google-services.json)."
            exit 1
          fi
          echo "API_BASE=$API_BASE" > .env
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          flutter pub get

      - name: Analyze Dart code
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: flutter build apk --debug --dart-define=API_BASE="$API_BASE"

      - name: Build release APK (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --dart-define=API_BASE="$API_BASE"

      - name: Keep release APK (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fitflex-release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
